name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    name: Rust Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Pin ed25519-dalek to 2.2.0 (compatibility fix)
        working-directory: contracts
        run: |
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0 || true

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --all

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: solar-savings/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: solar-savings/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: solar-savings/frontend
        run: npm test -- --watchAll=false --passWithNoTests

